name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every gate runs on each Node major in `engines.node` (^22.22.3 || ^24.15.0 || ^26.0.0)
# and treats warnings as failures:
#
#   - `.github/actions/setup` installs with `--strict-peer-dependencies` and fails the
#     job if pnpm logged any WARN — including "Unsupported engine", which is how a
#     runner drifting below the Angular CLI's Node floor surfaces.
#   - `pnpm lint` carries `--max-warnings=0`, so a rule set to "warn" fails the job
#     instead of scrolling past in the log.
#   - `scripts/ci/assert-no-warnings.sh` fails the build and test jobs on any esbuild
#     or Angular CLI warning. `ng build` exits 0 on a bundle-budget overrun, so without
#     this the budget is advisory.
#   - `scripts/ci/assert-for-track.mjs` and `scripts/ci/assert-image-hygiene.mjs` read every
#     component template through the Angular compiler's own parser and check two things a
#     rendered assertion cannot see: that a `@for`'s track expression identifies the row, and
#     that every `<img>` is under `NgOptimizedImage` correctly. Both failures are silent —
#     a wrong track expression renders the right text while rebuilding every node, and an
#     `<img ngSrc>` in a component that forgot to import the directive keeps a literal
#     `ngsrc` attribute and no `src` at all. Neither the compiler nor ESLint says a word
#     about either. They run in the `lint` job because they read source and need no build,
#     and each proves its own rules against fixtures before certifying the repository.
#     See `docs/track-expressions.md` and `docs/images.md`.
#   - `scripts/ci/assert-i18n-coverage.mjs` fails when a string a user can read is not
#     translatable, when a message has no explicit `@@id`, or when a translation file has
#     drifted from the catalogue it was made from. All three are silent otherwise:
#     `ng extract-i18n` never sees an unmarked string, and an explicit id means a reworded
#     English sentence keeps its stale translations rather than failing as missing.
#   - `scripts/ci/assert-no-token-persistence.mjs` fails when shipped source puts an auth
#     token where a later page load can read it — a write to web storage under a token-shaped
#     key, or any assignment to `document.cookie`. It is a gate rather than a spec because
#     the claim is about every line of source and a spec only covers the lines it calls: a
#     "remember me" checkbox that persists the access token leaves every existing test green
#     while removing the one defence that makes an XSS bug survivable. The nearby
#     `no-restricted-globals` lint rule bans the bare `localStorage` *global* for a different
#     reason (it is undefined under SSR), and `storageOf(...)` satisfies it. See
#     `docs/token-storage.md`.
#   - `scripts/ci/assert-csrf.mjs` fails when the CSRF contract has drifted apart from
#     itself, or when `csrfInterceptor` leaves the scope that bounds where the token may
#     travel. Both are invisible to the test suites: each half of a drifted contract is
#     internally consistent and passes its own assertions, and an unscoped interceptor
#     leaks the token only to hosts no test posts to. The `csrf` job below is the
#     behavioural half, in a browser, against a real implementation of the server's rules.
#     See `docs/csrf.md`.
#   - `scripts/ci/assert-owasp-checklist.mjs` fails when the OWASP checklist in
#     `src/app/core/security/owasp.ts` claims something this workflow does not actually
#     check. Every claim names the test that proves it, and the gate resolves each one
#     against the filesystem and against this file: a spec that was renamed, an e2e case
#     parked in the `chromium` project (which is deliberately not a gate here), a
#     `check:*` script dropped from the jobs below, or a rule deleted from inside a gate
#     these jobs still run. All four leave the checklist reading green, which is the whole
#     failure mode of a checklist — it is the most reassuring artifact a repository can
#     hold and every way it rots is silent. The gate also owns the two supply-chain claims
#     that are about the manifest rather than any line of code: that no dependency runs an
#     install script, and that CI installs the lockfile it was given. See
#     `docs/owasp-top-10.md`.
#   - `scripts/ci/assert-lint-bans.mjs` proves the two security bans in `eslint.config.mjs`
#     still fire, by linting source that must be refused — `bypassSecurityTrust*` and the
#     `location` sink an open redirect needs. `pnpm lint` enforces both, but only while the
#     rules still *match*: a mistyped alternation in the AST selector, or one object
#     removed from a `no-restricted-globals` array, leaves `pnpm lint` passing on every
#     file forever, and the only signal is the absence of an error nobody was expecting.
#     See `docs/security.md` and `docs/owasp-top-10.md`.
#   - `scripts/ci/assert-tdd-kata.mjs` replays the recorded kata in `katas/` — every step,
#     through this repository's own test command — and fails when a step has stopped being
#     the colour it records, or has become that colour for a different reason. It is a gate
#     rather than a document because every way a recorded kata rots is silent and most of
#     them read as tidying: a green step whose spec was edited (which is the one move the
#     discipline has no answer for), a red step that also changed the implementation, a red
#     whose failure moved to another assertion, a deleted test, an `xit`, a "refactor" that
#     follows a red step, or a last step describing a module `src/` has since moved past.
#     `git log` cannot check any of it — the squash merge that lands each item replaces the
#     eleven commits with one and deletes the branch, which is why the steps are recorded in
#     the tree at all. See `docs/tdd.md`.
#   - `scripts/ci/assert-logical-properties.mjs` fails on a physical-direction Tailwind
#     utility. `dir="rtl"` moves only what is written logically, so a layout on `ml-`,
#     `left-` or `border-r` mirrors into a consistent, plausible, wrong version of itself
#     — which no compiler, linter or accessibility audit can see. See `docs/i18n.md`.
#   - `scripts/dev/make-placeholder-images.mjs --check` fails if the generated fixtures in
#     `public/img/` no longer match the script that produces them, so the checked-in binaries
#     stay reproducible rather than becoming art nobody can rebuild.
#   - `scripts/ci/assert-no-zonejs.sh` fails the build job if ZoneJS reaches the bundle.
#     Unlike the gates above this one is not about warnings: nothing warns when ZoneJS
#     comes back, which is exactly why it needs its own check (see `docs/zoneless.md`).
#   - `scripts/ci/assert-deferred-chunks.mjs` fails the build job when a `@defer` block
#     has stopped splitting a chunk. Same shape of problem as ZoneJS and the same reason
#     it is checked against the artifact: an eager reference to a deferred component is
#     silent — it moves code between two lazy chunks, so the initial-bundle budget does
#     not move either (see `docs/defer.md`).
#   - `scripts/ci/assert-route-budgets.mjs` fails the build job when a route costs more
#     JavaScript than it is budgeted, or when route splitting has quietly collapsed. Also
#     not a warning problem: `ng build` has no per-route budget to warn about, and growth
#     behind a lazy route leaves the initial total untouched (see `docs/route-budgets.md`).
#   - `pnpm e2e:a11y` audits the running application with axe-core against WCAG 2.2 AA and
#     fails on any violation. It is its own job rather than a step in `test` because it is
#     the only gate that needs a browser *and* a server: it drives `ng serve` through
#     Playwright, so it audits the composed document — the cascade, the landmarks, the
#     heading tree, the layout — none of which a `TestBed` fixture has. Every route is
#     audited in both themes, which is how it found that the theme toggle and Tailwind's
#     `dark:` variant had never been connected. See `docs/accessibility.md`.
#   - `scripts/ci/assert-ssr.mjs` starts the built server and checks what it answers. It is
#     the only gate here that runs the artifact rather than reading it, because the ways SSR
#     breaks are all invisible to a bundle and to a browser-run unit suite: a browser-only
#     global reached during a render, a platform-specific provider, a route whose render
#     mode changed, a `@defer (hydrate …)` block that arrives hydrated (see `docs/ssr.md`).
#   - `scripts/ci/assert-csp.mjs` starts the built server and checks that each document it
#     serves carries a *fresh* nonce and a policy that still refuses what it exists to
#     refuse. It runs the artifact for the same reason `check:ssr` does, and it leans on
#     comparing two responses because a nonce that has stopped being per-response — baked
#     into `index.html`, reused, or cached behind an `ETag` — leaves an application that
#     works perfectly and a policy that authorises a constant. Nothing warns, nothing is
#     blocked, and axe has nothing to say (see `docs/security.md`).
#   - `NODE_OPTIONS: --throw-deprecation` promotes Node runtime deprecation warnings to
#     thrown errors, so a deprecated API — ours or a dependency's — surfaces on the
#     oldest and the newest supported runtime rather than when it is finally removed.
#     `--pending-deprecation` is deliberately not set: it flags APIs that are not
#     deprecated yet, which would fail the build on advisory notices.
#   - `scripts/ci/assert-no-unexpected-deprecations.sh` enforces that same policy on the two
#     steps that run `ng build`, which cannot carry `--throw-deprecation`: Angular's SSR
#     route extractor calls `module.register()`, deprecated on Node 26 as DEP0205, from
#     inside a prerender worker — so the flag turns a dependency's one-line deprecation
#     into "An error occurred while extracting routes" and 0 prerendered routes. Those two
#     steps run without the flag and have their logs scanned instead, with DEP0205 the only
#     allow-listed code. The script's header has the whole finding.
#
# `format` runs on a single Node major on purpose. Prettier's output is a pure function
# of the source and `.prettierrc`, so running it three times only burns runner minutes.

jobs:
  lint:
    name: Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Lint
        run: pnpm lint
        env:
          NODE_OPTIONS: --throw-deprecation

      # OnPush is a decorator-metadata property, not a lint rule and not a compile
      # error — neither ESLint nor the Angular compiler flags a Default component.
      # Under zoneless the practical cost of Default is a full check of every view
      # in the tree on each refresh; `docs/change-detection-profiling.md` explains
      # why. This assertion is the source-level counterpart of the runtime rule.
      - name: Assert OnPush on every production component
        run: pnpm check:onpush

      # Source-level, so they belong here rather than in `build`: both read the templates
      # through `@angular/compiler` and need no bundle. One Node major would be enough for
      # a pure function of the source, but the matrix costs nothing for a parse and catches
      # a TypeScript or compiler API that behaves differently on a newer runtime.
      - name: Assert every @for tracks its row
        run: pnpm check:tracks

      - name: Assert every <img> is optimised
        run: pnpm check:images

      - name: Assert the generated image fixtures are reproducible
        run: pnpm check:fixtures

      # The negative half of the typed-form tests. `pnpm typecheck` proves the helpers
      # compile and `pnpm test` compiles the `expectTypeEquals` assertions, but neither can
      # say what the helpers *reject* — code that does not compile cannot be in a spec. This
      # compiles a directory of fixtures that are supposed to fail and checks each one fails
      # for the reason it names. See docs/typed-forms.md.
      - name: Assert the typed-form helpers still reject what they are meant to
        run: pnpm check:form-types

      # Source-level like the two above, and the same shape of problem: an unmarked string
      # does not shrink the message catalogue, it never enters it, so `ng extract-i18n` is
      # silent and the only place the omission exists is the translated page. `check:i18n`
      # also reads the translation files, where it catches the failure explicit `@@ids`
      # create: a reworded English string keeps its old translations, because the id still
      # matches. See docs/i18n.md.
      - name: Assert every user-visible string is translatable, and every translation current
        run: pnpm check:i18n

      # `dir="rtl"` only reaches properties written logically. A layout on `ml-`/`left-`/
      # `border-r` reflows into a consistently wrong mirror of itself with nothing failing
      # — not the compiler, not the linter, and not the axe audit, which reads the
      # accessibility tree where "left" is not a concept. `e2e/a11y/rtl.spec.ts` measures
      # the rendered result; this bans the utilities that cause it.
      - name: Assert the layout is written in logical properties
        run: pnpm check:rtl

      # Source-level, and the counterpart to `docs/token-storage.md`: the access token
      # lives in memory and the refresh token never reaches JavaScript at all. Both are
      # properties of every line rather than of any one call path, which is why they are
      # checked here instead of only in a spec.
      - name: Assert no auth token is persisted anywhere a page load can read it
        run: pnpm check:tokens

      # Source-level, and about agreement rather than behaviour. The two names in the CSRF
      # contract have six readers — `withXsrfConfiguration`, the interceptor that writes
      # the header, the server contract in `e2e/helpers/`, the mocks, the specs and
      # `docs/csrf.md` — and a repository where one of them had grown its own literal
      # passes every test, because each half of the disagreement is internally consistent.
      # It also fails if `csrfInterceptor` leaves the `requestsUnder(environment.apiUrl)`
      # scope, which is where the security property lives: a token sent to an arbitrary
      # origin is a token handed to whoever is on the other end, and no test here posts to
      # a third-party host to notice. See `docs/csrf.md`.
      - name: Assert the CSRF contract has one definition and the document matches it
        run: pnpm check:csrf

      # Source-level, and about agreement like `check:csrf` — but between a claim and the
      # thing that enforces it rather than between two copies of a name. `docs/owasp-top-10.md`
      # is what an auditor reads and what an API author implements the server half from, and
      # the ways it rots are all silent: a spec renamed while tidying leaves the claim it
      # carried unproven with the suite still green; a Playwright case cited from the
      # `chromium` project is a test somebody wrote rather than a check that blocks a merge;
      # a `check:*` script dropped from this workflow keeps working on a developer's machine
      # and enforces nothing on a pull request. So every proof is resolved against the
      # filesystem and against this file, in both directions.
      - name: Assert every claim in the OWASP checklist is one CI actually checks
        run: pnpm check:owasp

      # The other half of the sanitisation ban, and of the open-redirect one. Both are
      # enforced by a lint rule and by nothing else, and a rule that has stopped matching
      # is indistinguishable from a repository that complies — so the rules are run against
      # source that is supposed to trip them, plus compliant source that must stay clean.
      # Same arrangement as `check:form-types`, which proves the typed-form helpers by
      # compiling code that must not compile.
      - name: Assert the security lint bans still fire
        run: pnpm check:lint-bans

  typecheck:
    name: Typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --throw-deprecation

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: '22'

      - name: Check formatting
        run: pnpm format:check
        env:
          NODE_OPTIONS: --throw-deprecation

  test:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      # karma-chrome-launcher shells out to CHROME_BIN. Resolving it explicitly means a
      # runner image that renames or drops the Chrome binary fails here, with a clear
      # message, instead of inside Karma as an opaque "browser never captured" timeout.
      - name: Resolve Chrome binary
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::No Chrome/Chromium binary found on this runner."
            exit 1
          fi
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          echo "Using $CHROME"

      # `test:ci` rather than `pnpm test -- --browsers=…`: the extra `--` makes the Angular
      # CLI treat `--no-watch`/`--no-progress` as unknown positional arguments and abort.
      - name: Run unit tests
        run: |
          set -o pipefail
          pnpm test:ci 2>&1 | tee "$RUNNER_TEMP/test.log"
        env:
          NODE_OPTIONS: --throw-deprecation

      - name: Fail on test-build warnings
        run: ./scripts/ci/assert-no-warnings.sh "$RUNNER_TEMP/test.log"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7

  kata:
    name: TDD kata replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: '22'

      # Same resolution as the `test` job, and needed for the same reason: each step is
      # replayed through `ng test`, which launches Chrome through `CHROME_BIN`.
      - name: Resolve Chrome binary
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::No Chrome/Chromium binary found on this runner."
            exit 1
          fi
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"

      # Its own job because it needs a browser and because it is eleven builds — about
      # four minutes, which is longer than any step in `test` and would stretch the
      # fastest-failing job in the workflow.
      #
      # One Node major. What a step's colour is a property of is the source and the
      # compiler, and the gate's own rules are pure functions checked by `--self-test`
      # before it certifies anything.
      - name: Replay the recorded kata
        run: pnpm check:kata
        env:
          NODE_OPTIONS: --throw-deprecation

  a11y:
    name: Accessibility (WCAG 2.2 AA, focus and live regions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: '22'

      # Chromium only, and only the browser: the audit runs in one engine because axe
      # reports on the accessibility tree and the computed cascade, which do not differ
      # between engines in the ways these rules read. `--with-deps` because the runner
      # image carries the browser's shared libraries for Chrome, not for Playwright's
      # pinned build.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # One Node major, like `format` and the bundle gates: what this measures is a
      # property of the rendered document, and the document does not change with the
      # runtime that served it.
      # Three suites in one project. `axe.spec.ts`/`a11y.spec.ts` audit each route at rest;
      # `focus-and-announcements.spec.ts` covers what a scanner structurally cannot see —
      # where focus lands after a navigation, and whether a live region ever changes —
      # because both are properties of the transition between two documents rather than of
      # either document; and `rtl.spec.ts` measures the layout mirrored, which is the half
      # of the RTL pass that a source-level rule cannot reach. See
      # `docs/focus-and-live-regions.md` and `docs/i18n.md`.
      - name: Audit every route, interaction state, and navigation
        run: pnpm e2e:a11y
        env:
          NODE_OPTIONS: --throw-deprecation

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: playwright-report/
          retention-days: 7

  csrf:
    name: CSRF contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The other half of `check:csrf`, and the half that needs a browser. Every API
      # request these cases make is adjudicated by `e2e/helpers/csrf-contract.ts` — the
      # rules in `docs/csrf.md`, implemented — and anything failing them is answered 403
      # before it reaches an endpoint. So a regression that stopped sending the token does
      # not fail a header expectation, it fails sign-in: proven by removing
      # `csrfInterceptor` from the chain, which turns all seven browser cases red on
      # `expect(page).toHaveURL('/dashboard')`.
      #
      # Two things only a browser can answer, which is why this is not left to the unit
      # suite. Whether the cookie the token came from is actually *attached* to the request
      # is `withCredentials` plus the browser's own `SameSite`, `Path`, `Domain` and
      # port-insensitivity rules, none of which a `TestBed` can observe — a spec can prove
      # the flag was set, only this can prove it had the intended effect. And whether the
      # protection refuses the request an attacker can actually cause: the cookie attached
      # by the browser, no header, because no cross-site page can set one.
      #
      # One Node major, like `a11y` and the bundle gates: what this measures is a property
      # of the requests the application makes, not of the runtime that served them.
      - name: Verify the CSRF contract against a real browser
        run: pnpm e2e:csrf
        env:
          NODE_OPTIONS: --throw-deprecation

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: csrf-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [lint, typecheck, format, test]
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      # No `--throw-deprecation` here, unlike every other step: see the note above and the
      # header of assert-no-unexpected-deprecations.sh. The policy is enforced by the step
      # after next instead, against this log.
      - name: Build
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Fail on build warnings
        run: ./scripts/ci/assert-no-warnings.sh "$RUNNER_TEMP/build.log"

      - name: Fail on unexpected deprecation warnings
        run: ./scripts/ci/assert-no-unexpected-deprecations.sh "$RUNNER_TEMP/build.log"

      # Zoneless is a build-output property, not just a provider choice: putting
      # `zone.js` back in `angular.json` breaks nothing and fails nothing, it only
      # re-adds ~35 kB to the bundle. This checks the emitted JavaScript instead.
      - name: Fail if ZoneJS is in the bundle
        run: ./scripts/ci/assert-no-zonejs.sh dist/boilerplate-angular

      # Two gates ask questions that only the module graph can answer, and `pnpm build`
      # deliberately does not emit the metafile that holds it (it would ship inside
      # `dist/`). So the bundle is built once more, with `--stats-json`, into `.stats/`
      # and both gates read that — one extra build for both rather than one each.
      #
      # One Node major, like `format`, and for the same reason: the chunk graph is a
      # function of the source and the bundler, so running it three times only burns
      # runner minutes.
      #
      # No `--throw-deprecation`, same as `Build` above and for the same reason: this is
      # `ng build` too, so it takes the same route through the prerenderer.
      - name: Build again with the bundler metafile
        if: matrix.node-version == '22'
        run: |
          set -o pipefail
          pnpm stats 2>&1 | tee "$RUNNER_TEMP/stats.log"

      - name: Fail on unexpected deprecation warnings in the stats build
        if: matrix.node-version == '22'
        run: ./scripts/ci/assert-no-unexpected-deprecations.sh "$RUNNER_TEMP/stats.log"

      # Whether a `@defer` block still defers anything is invisible everywhere else: an
      # eager reference to a deferred component moves the code between two lazy chunks,
      # which no budget, no lint rule and no spec can see. `docs/defer.md` says what this
      # checks.
      - name: Assert every @defer block still splits its chunk
        if: matrix.node-version == '22'
        run: pnpm check:defer
        env:
          STATS_JSON: .stats/stats.json

      # The `initial` budget in `angular.json` prices the first paint. It says nothing
      # about what a user pays on top of it to reach a page, which is the whole point of
      # putting every feature behind a lazy route — a route's chunk can double, or start
      # pulling a library in through a shared chunk, without moving the initial total by
      # a byte. This prices each route and posts the audit to the job summary;
      # `docs/route-budgets.md` says how the numbers are arrived at.
      - name: Assert every route is within its bundle budget
        if: matrix.node-version == '22'
        run: pnpm check:routes
        env:
          STATS_JSON: .stats/stats.json

      # The server half of the build, exercised. `pnpm build` emits `dist/<project>/server`
      # on every Node major, but booting it once is enough: what this asserts is a property
      # of the artifact, not of the runtime that built it — same reasoning as `pnpm stats`
      # above.
      - name: Assert the server renders what each route promises
        if: matrix.node-version == '22'
        run: pnpm check:ssr
        env:
          NODE_OPTIONS: --throw-deprecation

      # The other gate that runs the artifact, and the one with the least to go on: a
      # nonce has exactly one security property — unpredictability — and *every* way of
      # losing it leaves a working application. A nonce baked into index.html works; one
      # reused across every response works; one served with an ETag, so the browser keeps
      # replaying its cached copy, works. Measured on this repository: three loads of
      # /login, one nonce, page correct every time, nothing blocked and nothing logged.
      # No console error, no failed request, no visual defect, and nothing for axe to
      # report. So this gate is mostly about the difference between two responses, which
      # is the one thing a single request cannot show. See docs/security.md.
      - name: Assert every document gets a fresh nonce and an enforceable policy
        if: matrix.node-version == '22'
        run: pnpm check:csp
        env:
          NODE_OPTIONS: --throw-deprecation

      - name: Upload build artifact
        # One copy of `dist/` is enough; the other majors still have to build cleanly.
        if: matrix.node-version == '22'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
