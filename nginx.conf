# Static-only deployment of `dist/boilerplate-angular/browser`.
#
# The Dockerfile runs the Node server instead (see docs/ssr.md); this is kept for a
# deployment that has no process to run. It loses the server-resolved redirects for `/`
# and unknown paths — the browser follows them after boot rather than before — but it
# does keep the prerendered pages: `/login`, `/register` and `/unauthorized` are real
# directories with an `index.html`, which `try_files $uri/` finds before the fallback.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # `index.csr.html`, not `index.html`. A build with `outputMode: "server"` emits the
    # client-side-rendering shell under that name and emits no root `index.html` at all,
    # so a config naming the old one 404s every unprerendered route.
    index index.csr.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A prerendered page if there is one, otherwise the client-rendering shell.
    location / {
        try_files $uri $uri/ /index.csr.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
